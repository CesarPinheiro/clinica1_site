<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; background: #fff; }

  .cta-wrap {
    padding: 56px 24px;
    text-align: center;
    background: linear-gradient(135deg, #0a1628 0%, #0d2147 60%, #0a3d62 100%);
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(37,211,102,0.15);
    border: 1px solid rgba(37,211,102,0.35);
    color: #25D366;
    font-size: 12px;
    font-weight: 700;
    padding: 5px 16px;
    border-radius: 999px;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    margin-bottom: 24px;
  }

  .cta-wrap h2 {
    font-size: clamp(22px, 4vw, 36px);
    font-weight: 800;
    color: #fff;
    line-height: 1.2;
    margin-bottom: 12px;
  }

  .cta-wrap p {
    font-size: 16px;
    color: rgba(255,255,255,0.65);
    max-width: 500px;
    margin: 0 auto 36px;
    line-height: 1.7;
  }

  .btn-group {
    display: flex;
    gap: 14px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .btn-outline {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(255,255,255,0.08);
    border: 1.5px solid rgba(255,255,255,0.3);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    padding: 14px 26px;
    border-radius: 12px;
    text-decoration: none;
    transition: background 0.2s, border-color 0.2s;
  }
  .btn-outline:hover { background: rgba(255,255,255,0.16); border-color: rgba(255,255,255,0.5); }

  .btn-wa {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: #25D366;
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    padding: 14px 26px;
    border-radius: 12px;
    text-decoration: none;
    box-shadow: 0 4px 20px rgba(37,211,102,0.4);
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .btn-wa:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(37,211,102,0.5); }
  .btn-wa svg { width: 20px; height: 20px; fill: #fff; flex-shrink: 0; }
</style>
</head>
